name: Deploy quick-tx

# Publica a Edge Function quick-tx (atalho de voz) automaticamente sempre
# que o código dela muda na branch principal -- antes, isso só acontecia
# se alguém lembrasse de fazer o redeploy manual pelo painel do Supabase.
#
# Requer o secret SUPABASE_ACCESS_TOKEN no repositório (Settings > Secrets
# and variables > Actions) -- um Access Token gerado em
# https://supabase.com/dashboard/account/tokens, com escopo só de deploy
# de functions se o plano permitir escopo restrito.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/quick-tx/**"
  workflow_dispatch:   # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy quick-tx
        # --no-verify-jwt: a function usa seu próprio segredo (QUICK_TX_SECRET),
        # não uma sessão do Supabase Auth -- sem essa flag, o gateway do
        # Supabase passaria a exigir um JWT válido antes mesmo de a function
        # rodar, quebrando o atalho de voz (ver comentário no topo do index.ts).
        run: supabase functions deploy quick-tx --no-verify-jwt --project-ref wbnefvskqudjnmafpqnn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
