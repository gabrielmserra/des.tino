name: Keep Supabase Alive

# Projetos Supabase do plano grátis pausam após ~1 semana sem atividade no banco.
# Este workflow faz um ping diário no REST (executa uma query no Postgres),
# registrando atividade e evitando a pausa automática.

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 09:17 UTC
  workflow_dispatch:        # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase (query leve no banco)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/months?select=id&limit=1")
          echo "Resposta HTTP: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Ping ao Supabase falhou (HTTP $code)"
            exit 1
          fi
          echo "Supabase ativo — ping ok."
